apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: monitoring
  labels:
    app: grafana
    component: monitoring
data:
  chapinflix-overview.json: |-
    {
      "title": "Chapinflix - Overview Dashboard",
      "uid": "chapinflix-overview",
      "timezone": "",
      "schemaVersion": 27,
      "version": 1,
      "refresh": "10s",
      "panels": [
        {
          "id": 1,
          "title": "Running Pods",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 0, "y": 0},
          "targets": [{
            "expr": "count(kube_pod_status_phase{namespace=\"default\", phase=\"Running\"})",
            "refId": "A"
          }],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "green", "value": 5}
                ]
              }
            }
          }
        },
        {
          "id": 2,
          "title": "Auth Service Status",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 6, "y": 0},
          "targets": [{
            "expr": "up{kubernetes_pod_name=~\"auth-service.*\"}",
            "refId": "A"
          }],
          "options": {
            "colorMode": "background",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"color": "red", "text": "DOWN"},
                    "1": {"color": "green", "text": "UP"}
                  }
                }
              ]
            }
          }
        },
        {
          "id": 3,
          "title": "Inventario Service Status",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 12, "y": 0},
          "targets": [{
            "expr": "up{kubernetes_pod_name=~\"inventario-service.*\"}",
            "refId": "A"
          }],
          "options": {
            "colorMode": "background",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "mappings": [
                {
                  "type": "value",
                  "options": {
                    "0": {"color": "red", "text": "DOWN"},
                    "1": {"color": "green", "text": "UP"}
                  }
                }
              ]
            }
          }
        },
        {
          "id": 4,
          "title": "All Services Status",
          "type": "stat",
          "gridPos": {"h": 4, "w": 6, "x": 18, "y": 0},
          "targets": [{
            "expr": "count(up{kubernetes_pod_name=~\".*-service.*\"} == 1)",
            "refId": "A"
          }],
          "options": {
            "colorMode": "value",
            "graphMode": "area",
            "textMode": "auto"
          },
          "fieldConfig": {
            "defaults": {
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "yellow", "value": 3},
                  {"color": "green", "value": 5}
                ]
              }
            }
          }
        },
        {
          "id": 5,
          "title": "Microservices CPU Usage",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 4},
          "targets": [{
            "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"default\", pod!=\"\", container!=\"POD\", container!=\"\"}[5m])) by (pod) * 100",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "percent",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10,
                "showPoints": "never"
              }
            }
          }
        },
        {
          "id": 6,
          "title": "Microservices Memory Usage (MB)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 4},
          "targets": [{
            "expr": "sum(container_memory_working_set_bytes{namespace=\"default\", pod!=\"\", container!=\"POD\", container!=\"\"}) by (pod) / 1024 / 1024",
            "legendFormat": "{{pod}}",
            "refId": "A"
          }],
          "fieldConfig": {
            "defaults": {
              "unit": "decmbytes",
              "custom": {
                "lineWidth": 2,
                "fillOpacity": 10
              }
            }
          }
        },
        {
          "id": 7,
          "title": "Network Traffic (RX/TX)",
          "type": "timeseries",
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 12},
          "targets": [
            {
              "expr": "sum(rate(container_network_receive_bytes_total{namespace=\"default\"}[5m])) by (pod)",
              "legendFormat": "RX - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "sum(rate(container_network_transmit_bytes_total{namespace=\"default\"}[5m])) by (pod)",
              "legendFormat": "TX - {{pod}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        },
        {
          "id": 8,
          "title": "Pod Restarts",
          "type": "table",
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 12},
          "targets": [{
            "expr": "kube_pod_container_status_restarts_total{namespace=\"default\"}",
            "format": "table",
            "instant": true,
            "refId": "A"
          }],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "namespace": true,
                  "uid": true
                },
                "renameByName": {
                  "Value": "Restart Count",
                  "pod": "Pod Name",
                  "container": "Container"
                }
              }
            }
          ]
        },
        {
          "id": 9,
          "title": "HPA Current Replicas",
          "type": "table",
          "gridPos": {"h": 6, "w": 12, "x": 0, "y": 20},
          "targets": [{
            "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"default\"}",
            "format": "table",
            "instant": true,
            "refId": "A"
          }],
          "transformations": [
            {
              "id": "organize",
              "options": {
                "excludeByName": {
                  "Time": true,
                  "__name__": true,
                  "instance": true,
                  "job": true,
                  "namespace": true
                },
                "renameByName": {
                  "Value": "Current Replicas",
                  "horizontalpodautoscaler": "HPA Name"
                }
              }
            }
          ]
        },
        {
          "id": 10,
          "title": "Container Disk I/O",
          "type": "timeseries",
          "gridPos": {"h": 6, "w": 12, "x": 12, "y": 20},
          "targets": [
            {
              "expr": "sum(rate(container_fs_reads_bytes_total{namespace=\"default\"}[5m])) by (pod)",
              "legendFormat": "Read - {{pod}}",
              "refId": "A"
            },
            {
              "expr": "sum(rate(container_fs_writes_bytes_total{namespace=\"default\"}[5m])) by (pod)",
              "legendFormat": "Write - {{pod}}",
              "refId": "B"
            }
          ],
          "fieldConfig": {
            "defaults": {
              "unit": "Bps"
            }
          }
        }
      ]
    }