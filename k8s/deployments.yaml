# Auth Service (usa PostgreSQL)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: default
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth
        image: gcr.io/sa-proyecto-475802/sa-auth:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        env:
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: chapinflix-secrets
              key: DATABASE_URL
        - name: AUTH_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: chapinflix-secrets
              key: AUTH_SECRET_KEY
        - name: AUTH_ALGORITHM
          valueFrom:
            secretKeyRef:
              name: chapinflix-secrets
              key: AUTH_ALGORITHM
        - name: PORT
          value: "8000"
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: default
spec:
  selector:
    app: auth-service
  ports:
  - port: 8000
    targetPort: 8000
  type: ClusterIP
---
